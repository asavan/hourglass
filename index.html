<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Песочные Часы</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --button-bg: rgba(30, 41, 59, 0.8);
            --button-border: rgba(255, 255, 255, 0.15);
            --amber-gold: #d4af37;
            --amber-light: #fef08a;
            --amber-main: #f59e0b;
            --amber-hover: #d97706;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-amber: #fcd34d;
            --rose-red: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        .canvas-container {
            flex: 1;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 10;
        }

        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(217, 119, 6, 0.12);
            border-radius: 50%;
            filter: blur(54px);
            pointer-events: none;
            animation: pulse 3s infinite ease-in-out;
        }

        #hourglass-canvas {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            object-fit: contain;
            cursor: pointer;
        }

        .side-panel {
            width: 260px;
            height: 100vh;
            padding: 24px 16px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .top-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .icon-btn {
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: #ffffff;
            background: rgba(51, 65, 85, 0.9);
            transform: translateY(-1px);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .icon-sm {
            width: 14px;
            height: 14px;
        }

        .icon-md {
            width: 22px;
            height: 22px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 9999px;
            background-color: rgba(6, 78, 59, 0.8);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .timer-section {
            z-index: 20;
            text-align: center;
            margin: auto 0;
        }

        .digital-clock {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--text-amber);
            font-family: monospace;
            text-shadow: 0 0 14px rgba(252, 211, 77, 0.4);
        }

        .status-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .status-text.running {
            color: var(--amber-gold);
        }

        .status-text.finished {
            color: var(--rose-red);
            font-weight: 700;
            animation: bounce 1s infinite;
        }

        .hint-text {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            line-height: 1.4;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 24px;
            color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--amber-gold);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        .form-label-sub {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .text-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 16px;
            color: var(--text-amber);
            font-size: 1.125rem;
            font-weight: 600;
            text-align: center;
            outline: none;
        }

        .text-input:focus {
            border-color: var(--amber-main);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .preset-btn {
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-amber);
            padding: 8px 0;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background: rgba(245, 158, 11, 0.2);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
            font-size: 0.875rem;
            color: #cbd5e1;
        }

        .setting-block {
            padding-top: 10px;
            border-top: 1px solid #1e293b;
        }

        .secondary-btn-sm {
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-amber);
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .gyro-btn {
            width: 100%;
            padding: 10px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #1e293b;
            border-radius: 24px;
            transition: 0.3s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .toggle-slider {
            background-color: var(--amber-main);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .modal-footer {
            margin-top: 24px;
        }

        .save-btn {
            width: 100%;
            background: var(--amber-main);
            color: #020617;
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: var(--amber-hover);
        }

        .hidden {
            display: none !important;
        }

        .text-emerald {
            color: #34d399;
        }

        .mobile-toggle {
            display: none;
        }

        .panel-handle {
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @media (max-width: 600px) {
            body {
                flex-direction: column;
                position: relative;
            }
            .canvas-container {
                position: absolute;
                top: 60px;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100vw;
                height: calc(100vh - 60px);
                padding: 0 5px;
                z-index: 10;
            }
            .side-panel {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: auto;
                max-height: 60px;
                border-left: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.12);
                padding: 10px 16px 8px 16px;
                overflow: hidden;
                transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
                border-radius: 0 0 20px 20px;
                z-index: 30;
                background: rgba(15, 23, 42, 0.92);
            }
            .side-panel.expanded {
                max-height: 280px;
            }
            .top-actions {
                flex-direction: row;
                justify-content: space-between;
                height: 40px;
            }
            .mobile-toggle {
                display: flex;
            }
            .panel-handle {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                padding-top: 10px;
                padding-bottom: 4px;
                cursor: pointer;
            }
            .handle-bar {
                width: 36px;
                height: 4px;
                background-color: rgba(255, 255, 255, 0.25);
                border-radius: 2px;
            }
            .chevron-icon {
                transition: transform 0.3s ease;
            }
            .side-panel.expanded .chevron-icon {
                transform: rotate(180deg);
            }
            .timer-section {
                margin: 16px 0 8px 0;
            }
        }
    </style>
</head>
<body>

    <!-- Main Hourglass Canvas View (Left side, Full Height) -->
    <main class="canvas-container">
        <div class="ambient-glow"></div>
        <canvas id="hourglass-canvas"></canvas>
    </main>

    <!-- Side Control Panel (Right side / Top Overlay on Mobile) -->
    <aside class="side-panel">
        <div class="top-actions">
            <span id="gyro-status-badge" class="badge hidden">
                <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18v-6m0 0V6m0 6h6m-6 0H6"/>
                </svg>
                Гироскоп
            </span>

            <div class="action-buttons">
                <button id="panel-toggle-btn" class="icon-btn mobile-toggle" title="Информация" aria-label="Развернуть">
                    <svg class="icon-md chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <button id="manual-flip-btn" class="icon-btn" title="Перевернуть" aria-label="Перевернуть">
                    <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
                <button id="settings-btn" class="icon-btn" title="Настройки" aria-label="Настройки">
                    <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Digital Clock Display -->
        <div class="timer-section">
            <div id="digital-timer" class="digital-clock">01:00</div>
            <div id="status-label" class="status-text">Переверните, чтобы запустить</div>
        </div>

        <div id="gyro-hint" class="hint-text hidden">
            💡 Часы управляются гироскопом: просто переверните смартфон!
        </div>

        <div id="panel-handle" class="panel-handle">
            <span class="handle-bar"></span>
        </div>
    </aside>

    <!-- Settings Modal Dialog -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button id="close-settings-btn" class="close-btn" aria-label="Закрыть">
                    <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label for="minutes-input" class="form-label">Длительность (минуты):</label>
                    <input type="number" id="minutes-input" min="1" max="180" step="1" value="1" class="text-input">
                </div>

                <div class="form-group">
                    <label class="form-label-sub">Быстрый выбор:</label>
                    <div class="preset-grid">
                        <button class="preset-btn" data-mins="1">1 мин</button>
                        <button class="preset-btn" data-mins="3">3 мин</button>
                        <button class="preset-btn" data-mins="5">5 мин</button>
                        <button class="preset-btn" data-mins="10">10 мин</button>
                    </div>
                </div>

                <div class="setting-row">
                    <span>Показывать таймер</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-digital-timer" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="setting-row">
                    <span>Звуковой сигнал</span>
                    <button id="test-sound-btn" class="secondary-btn-sm">Проверить "Бип-бип"</button>
                </div>

                <div id="gyro-permission-block" class="setting-block">
                    <button id="request-gyro-btn" class="gyro-btn">
                        <svg class="icon-sm text-emerald" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18v-6m0 0V6m0 6h6m-6 0H6"/>
                        </svg>
                        <span>Включить/Разрешить гироскоп</span>
                    </button>
                </div>
            </div>

            <div class="modal-footer">
                <button id="save-settings-btn" class="save-btn">Сохранить и Применить</button>
            </div>
        </div>
    </div>

    <script>
        let config = {
            totalMinutes: 1,
            showDigitalTimer: true,
            soundEnabled: true
        };

        let state = {
            totalSeconds: 60,
            sandA: 0.0, // Top bulb sand ratio
            sandB: 1.0, // Bottom bulb sand ratio
            isFinished: false,
            visualRotation: 0,
            targetRotation: 0,
            hasGyroscope: false,
            lastFrameTime: performance.now(),
            sandParticles: []
        };

        const canvas = document.getElementById('hourglass-canvas');
        const ctx = canvas.getContext('2d');
        const digitalTimer = document.getElementById('digital-timer');
        const statusLabel = document.getElementById('status-label');
        const manualFlipBtn = document.getElementById('manual-flip-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const minutesInput = document.getElementById('minutes-input');
        const toggleDigitalTimer = document.getElementById('toggle-digital-timer');
        const testSoundBtn = document.getElementById('test-sound-btn');
        const gyroPermissionBlock = document.getElementById('gyro-permission-block');
        const requestGyroBtn = document.getElementById('request-gyro-btn');
        const gyroStatusBadge = document.getElementById('gyro-status-badge');
        const gyroHint = document.getElementById('gyro-hint');
        const panelToggleBtn = document.getElementById('panel-toggle-btn');
        const sidePanel = document.querySelector('.side-panel');
        const panelHandle = document.getElementById('panel-handle');

        function toggleMobilePanel() {
            sidePanel.classList.toggle('expanded');
        }

        if (panelToggleBtn) panelToggleBtn.addEventListener('click', toggleMobilePanel);
        if (panelHandle) panelHandle.addEventListener('click', toggleMobilePanel);

        // Touch swipe gesture for expanding/collapsing panel on mobile
        let touchStartY = 0;
        sidePanel.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        sidePanel.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diffY = touchEndY - touchStartY;

            if (diffY > 35 && !sidePanel.classList.contains('expanded')) {
                sidePanel.classList.add('expanded');
            } else if (diffY < -35 && sidePanel.classList.contains('expanded')) {
                sidePanel.classList.remove('expanded');
            }
        }, { passive: true });

        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) {
                    audioCtx = new AudioCtxClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playBeepBeepBeep() {
            try {
                const actx = getAudioContext();
                if (!actx) return;

                const beeps = [0, 0.2, 0.4];
                const beepDuration = 0.12;

                beeps.forEach((startTime) => {
                    const osc = actx.createOscillator();
                    const gain = actx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, actx.currentTime + startTime);

                    gain.gain.setValueAtTime(0.01, actx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.3, actx.currentTime + startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + startTime + beepDuration);

                    osc.connect(gain);
                    gain.connect(actx.destination);

                    osc.start(actx.currentTime + startTime);
                    osc.stop(actx.currentTime + startTime + beepDuration);
                });
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);

        function getGlassHeight(w, h) {
            const capHeight = 16;
            const extraHeight = capHeight * 2 + 10; // Caps top & bottom + padding
            const extraWidth = 24 + 10; // Cap width margin + side padding
            
            const maxH = h - extraHeight;
            const maxW = (w - extraWidth) / 0.52;
            
            return Math.max(120, Math.min(maxH, maxW));
        }

        function updateSandParticles(dt, isFlowing, isTopBulbA, halfH, targetSandH) {
            if (isFlowing && Math.random() < 0.85) {
                const speed = isTopBulbA ? (120 + Math.random() * 120) : -(120 + Math.random() * 120);
                state.sandParticles.push({
                    x: (Math.random() - 0.5) * 4,
                    y: 0,
                    vx: (Math.random() - 0.5) * 10,
                    vy: speed,
                    size: 1.2 + Math.random() * 1.5,
                    life: 0
                });
            }

            const limitY = Math.max(0, halfH - targetSandH - 4);

            for (let i = state.sandParticles.length - 1; i >= 0; i--) {
                let p = state.sandParticles[i];
                p.y += p.vy * dt;
                p.x += p.vx * dt;
                p.life += dt;

                const hitSand = isTopBulbA ? (p.y >= limitY) : (p.y <= -limitY);

                if (p.life > 0.55 || hitSand) {
                    state.sandParticles.splice(i, 1);
                }
            }
        }

        function drawHourglass() {
            const w = canvas.width / (window.devicePixelRatio || 1);
            const h = canvas.height / (window.devicePixelRatio || 1);
            
            ctx.clearRect(0, 0, w, h);

            ctx.save();
            ctx.translate(w / 2, h / 2);

            const rotationDiff = state.targetRotation - state.visualRotation;
            if (Math.abs(rotationDiff) > 0.1) {
                state.visualRotation += rotationDiff * 0.14;
            } else {
                state.visualRotation = state.targetRotation;
            }

            const rad = (state.visualRotation * Math.PI) / 180;
            const cosA = Math.cos(rad);

            ctx.rotate(rad);

            const glassHeight = getGlassHeight(w, h);
            const glassWidth = glassHeight * 0.52;
            const halfH = glassHeight / 2;
            const halfW = glassWidth / 2;
            const neckRadius = 8;

            const capHeight = 16;
            const capWidth = glassWidth + 24;

            const capGrad = ctx.createLinearGradient(-capWidth/2, 0, capWidth/2, 0);
            capGrad.addColorStop(0, '#5c3a21');
            capGrad.addColorStop(0.3, '#a37042');
            capGrad.addColorStop(0.5, '#e3b888');
            capGrad.addColorStop(0.7, '#a37042');
            capGrad.addColorStop(1, '#5c3a21');

            // Top Wooden Cap
            ctx.fillStyle = capGrad;
            ctx.beginPath();
            ctx.roundRect(-capWidth/2, -halfH - capHeight, capWidth, capHeight, [6, 6, 2, 2]);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Bottom Wooden Cap
            ctx.beginPath();
            ctx.roundRect(-capWidth/2, halfH, capWidth, capHeight, [2, 2, 6, 6]);
            ctx.fill();
            ctx.stroke();

            // Side Pillars
            const pillarOffset = halfW + 6;
            const pillarGrad = ctx.createLinearGradient(0, -halfH, 0, halfH);
            pillarGrad.addColorStop(0, '#80532c');
            pillarGrad.addColorStop(0.5, '#d4af37');
            pillarGrad.addColorStop(1, '#80532c');

            ctx.fillStyle = pillarGrad;
            ctx.fillRect(-pillarOffset - 5, -halfH, 6, glassHeight);
            ctx.fillRect(pillarOffset - 1, -halfH, 6, glassHeight);

            function drawBulbAPath() {
                ctx.beginPath();
                ctx.moveTo(-neckRadius, -6);
                ctx.bezierCurveTo(-neckRadius - 10, -halfH * 0.4, -halfW, -halfH * 0.7, -halfW + 4, -halfH + 2);
                ctx.lineTo(halfW - 4, -halfH + 2);
                ctx.bezierCurveTo(halfW, -halfH * 0.7, neckRadius + 10, -halfH * 0.4, neckRadius, -6);
                ctx.closePath();
            }

            function drawBulbBPath() {
                ctx.beginPath();
                ctx.moveTo(-neckRadius, 6);
                ctx.bezierCurveTo(-neckRadius - 10, halfH * 0.4, -halfW, halfH * 0.7, -halfW + 4, halfH - 2);
                ctx.lineTo(halfW - 4, halfH - 2);
                ctx.bezierCurveTo(halfW, halfH * 0.7, neckRadius + 10, halfH * 0.4, neckRadius, 6);
                ctx.closePath();
            }

            const maxSandH = halfH - 12;

            const isCanvasFlipped = (Math.cos(rad) < 0);
            const isTopBulbA = isUpsideDown ? isCanvasFlipped : !isCanvasFlipped;

            // Render Sand in Local Bulb A
            if (state.sandA > 0.0005) {
                ctx.save();
                drawBulbAPath();
                ctx.clip();

                const isTopA = isTopBulbA;
                const visualRatioA = isTopA ? Math.pow(state.sandA, 0.6) : Math.pow(state.sandA, 0.85);
                const sandH = Math.max(isTopA ? 6 : 2, maxSandH * visualRatioA);

                const sandGrad = ctx.createLinearGradient(0, -halfH, 0, 0);
                sandGrad.addColorStop(0, '#fef08a');
                sandGrad.addColorStop(0.5, '#eab308');
                sandGrad.addColorStop(1, '#ca8a04');

                ctx.fillStyle = sandGrad;
                ctx.beginPath();

                if (isTopA) {
                    const sandY = -sandH;
                    const funnelDip = (state.sandA > 0.005 && state.sandA < 0.98) ? Math.min(10, sandH * 0.4) : 2;
                    ctx.moveTo(-halfW, sandY);
                    ctx.quadraticCurveTo(0, sandY + funnelDip, halfW, sandY);
                    ctx.lineTo(halfW, 0);
                    ctx.lineTo(-halfW, 0);
                } else {
                    const sandY = -halfH + sandH;
                    const conePeak = (state.sandB > 0.005 && state.sandA < 0.98) ? 12 : 2;
                    ctx.moveTo(-halfW, -halfH);
                    ctx.lineTo(-halfW, sandY - conePeak / 2);
                    ctx.quadraticCurveTo(0, sandY + conePeak, halfW, sandY - conePeak / 2);
                    ctx.lineTo(halfW, -halfH);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // Render Sand in Local Bulb B
            if (state.sandB > 0.0005) {
                ctx.save();
                drawBulbBPath();
                ctx.clip();

                const isTopB = !isTopBulbA;
                const visualRatioB = isTopB ? Math.pow(state.sandB, 0.6) : Math.pow(state.sandB, 0.85);
                const sandH = Math.max(isTopB ? 6 : 2, maxSandH * visualRatioB);

                const sandGrad = ctx.createLinearGradient(0, 0, 0, halfH);
                sandGrad.addColorStop(0, '#fef08a');
                sandGrad.addColorStop(0.5, '#eab308');
                sandGrad.addColorStop(1, '#ca8a04');

                ctx.fillStyle = sandGrad;
                ctx.beginPath();

                if (!isTopB) {
                    const sandY = halfH - sandH;
                    const conePeak = (state.sandA > 0.005 && state.sandB < 0.98) ? 12 : 2;
                    ctx.moveTo(-halfW, halfH);
                    ctx.lineTo(-halfW, sandY + conePeak / 2);
                    ctx.quadraticCurveTo(0, sandY - conePeak, halfW, sandY - conePeak / 2);
                    ctx.lineTo(halfW, halfH);
                } else {
                    const sandY = sandH;
                    const funnelDip = (state.sandB > 0.005 && state.sandB < 0.98) ? Math.min(10, sandH * 0.4) : 2;
                    ctx.moveTo(-halfW, sandY);
                    ctx.quadraticCurveTo(0, sandY - funnelDip, halfW, sandY);
                    ctx.lineTo(halfW, 0);
                    ctx.lineTo(-halfW, 0);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // Stream physics
            const topSandAmount = isTopBulbA ? state.sandA : state.sandB;
            const bottomSandAmount = isTopBulbA ? state.sandB : state.sandA;
            const targetSandH = maxSandH * Math.pow(bottomSandAmount, 0.85);

            if (topSandAmount > 0.0001) {
                ctx.save();
                
                if (isTopBulbA) {
                    drawBulbBPath();
                } else {
                    drawBulbAPath();
                }
                ctx.clip();

                const streamDir = isTopBulbA ? 1 : -1;
                const streamLength = halfH - targetSandH;

                const streamGrad = ctx.createLinearGradient(0, 0, 0, streamLength * streamDir);
                streamGrad.addColorStop(0, '#fef08a');
                streamGrad.addColorStop(0.5, '#eab308');
                streamGrad.addColorStop(1, 'rgba(234, 179, 8, 0.3)');

                ctx.fillStyle = streamGrad;
                ctx.beginPath();
                if (isTopBulbA) {
                    ctx.rect(-1.5, 0, 3, streamLength);
                } else {
                    ctx.rect(-1.5, -streamLength, 3, streamLength);
                }
                ctx.fill();

                ctx.fillStyle = '#fef08a';
                state.sandParticles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            }

            // Outer Glass Shell & Reflection
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';

            ctx.beginPath();
            ctx.moveTo(-halfW + 4, -halfH + 2);
            ctx.bezierCurveTo(-halfW, -halfH * 0.7, -neckRadius - 10, -halfH * 0.4, -neckRadius, -2);
            ctx.lineTo(-neckRadius, 2);
            ctx.bezierCurveTo(-neckRadius - 10, halfH * 0.4, -halfW, halfH * 0.7, -halfW + 4, halfH - 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(halfW - 4, -halfH + 2);
            ctx.bezierCurveTo(halfW, -halfH * 0.7, neckRadius + 10, -halfH * 0.4, neckRadius, -2);
            ctx.lineTo(neckRadius, 2);
            ctx.bezierCurveTo(neckRadius + 10, halfH * 0.4, halfW, halfH * 0.7, halfW - 4, halfH - 2);
            ctx.stroke();

            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.moveTo(-halfW + 12, -halfH + 20);
            ctx.bezierCurveTo(-halfW + 8, -halfH * 0.6, -neckRadius - 14, -halfH * 0.3, -neckRadius - 4, -15);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-halfW + 12, halfH - 20);
            ctx.bezierCurveTo(-halfW + 8, halfH * 0.6, -neckRadius - 14, halfH * 0.3, -neckRadius - 4, 15);
            ctx.stroke();

            ctx.restore();
        }

        function updateSimulation(now) {
            const dt = Math.min((now - state.lastFrameTime) / 1000, 0.1);
            state.lastFrameTime = now;

            const rad = (state.visualRotation * Math.PI) / 180;
            const isCanvasFlipped = (Math.cos(rad) < 0);
            const isTopBulbA = isUpsideDown ? isCanvasFlipped : !isCanvasFlipped;

            const topSand = isTopBulbA ? state.sandA : state.sandB;
            const bottomSandAmount = isTopBulbA ? state.sandB : state.sandA;

            const glassHeight = getGlassHeight(
                canvas.width / (window.devicePixelRatio || 1),
                canvas.height / (window.devicePixelRatio || 1)
            );
            const halfH = glassHeight / 2;
            const maxSandH = halfH - 12;
            const targetSandH = maxSandH * Math.pow(bottomSandAmount, 0.85);

            let isFlowing = false;

            if (topSand > 0) {
                isFlowing = true;
                const deltaSand = dt / state.totalSeconds;

                if (isTopBulbA) {
                    state.sandA = Math.max(0, state.sandA - deltaSand);
                    state.sandB = Math.min(1.0, state.sandB + deltaSand);
                } else {
                    state.sandB = Math.max(0, state.sandB - deltaSand);
                    state.sandA = Math.min(1.0, state.sandA + deltaSand);
                }

                const remainingTop = isTopBulbA ? state.sandA : state.sandB;
                if (remainingTop <= 0) {
                    state.isFinished = true;
                    updateUI();
                    if (config.soundEnabled) {
                        playBeepBeepBeep();
                    }
                }

                updateSandParticles(dt, true, isTopBulbA, halfH, targetSandH);
            } else {
                updateSandParticles(dt, false, isTopBulbA, halfH, targetSandH);
            }

            drawHourglass();
            updateTimerDisplay();

            requestAnimationFrame(updateSimulation);
        }

        function updateTimerDisplay() {
            if (!config.showDigitalTimer) {
                digitalTimer.style.display = 'none';
                return;
            }
            digitalTimer.style.display = 'block';

            const rad = (state.visualRotation * Math.PI) / 180;
            const isCanvasFlipped = (Math.cos(rad) < 0);
            const isTopBulbA = isUpsideDown ? isCanvasFlipped : !isCanvasFlipped;
            const currentTopSand = isTopBulbA ? state.sandA : state.sandB;

            const remainingSeconds = Math.max(0, Math.ceil(currentTopSand * state.totalSeconds));
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;

            digitalTimer.textContent = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateUI() {
            const rad = (state.visualRotation * Math.PI) / 180;
            const isCanvasFlipped = (Math.cos(rad) < 0);
            const isTopBulbA = isUpsideDown ? isCanvasFlipped : !isCanvasFlipped;
            const currentTopSand = isTopBulbA ? state.sandA : state.sandB;

            if (state.isFinished) {
                statusLabel.textContent = 'Время вышло! 🔔';
                statusLabel.className = 'status-text finished';
            } else if (currentTopSand > 0) {
                statusLabel.textContent = 'Песок течет...';
                statusLabel.className = 'status-text running';
            } else {
                statusLabel.textContent = 'Переверните, чтобы запустить';
                statusLabel.className = 'status-text';
            }
        }

        function flipHourglass() {
            getAudioContext();
            state.targetRotation += 180;
            state.isFinished = false;
            updateUI();
        }

        function resetTimer() {
            const rad = (state.targetRotation * Math.PI) / 180;
            const isCanvasFlipped = (Math.cos(rad) < 0);
            const isTopBulbA = isUpsideDown ? isCanvasFlipped : !isCanvasFlipped;

            if (isTopBulbA) {
                state.sandA = 0.0;
                state.sandB = 1.0;
            } else {
                state.sandA = 1.0;
                state.sandB = 0.0;
            }
            state.isFinished = false;
            state.sandParticles = [];
            updateUI();
        }

        let isUpsideDown = false;

        function handleOrientation(event) {
            const beta = event.beta;
            if (beta === null || beta === undefined) return;

            if (!state.hasGyroscope) {
                state.hasGyroscope = true;
                onGyroscopeDetected();
            }

            const currentlyFlipped = (beta < -25);

            if (currentlyFlipped !== isUpsideDown) {
                isUpsideDown = currentlyFlipped;
                state.isFinished = false;
                getAudioContext();
                updateUI();
            }
        }

        function onGyroscopeDetected() {
            gyroStatusBadge.classList.remove('hidden');
            gyroHint.classList.remove('hidden');
            manualFlipBtn.classList.add('hidden');
            
            const rad = (state.visualRotation * Math.PI) / 180;
            const isCanvasFlipped = (Math.cos(rad) < 0);
            const isTopBulbA = isUpsideDown ? isCanvasFlipped : !isCanvasFlipped;
            const currentTopSand = isTopBulbA ? state.sandA : state.sandB;

            if (currentTopSand === 0 && !state.isFinished) {
                statusLabel.textContent = 'Гироскоп активен. Переверните часы!';
            }
        }

        function initGyroscope() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    gyroPermissionBlock.classList.remove('hidden');
                } else {
                    gyroPermissionBlock.classList.add('hidden');
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            } else {
                gyroPermissionBlock.classList.add('hidden');
            }
        }

        manualFlipBtn.addEventListener('click', flipHourglass);
        canvas.addEventListener('click', flipHourglass);

        settingsBtn.addEventListener('click', () => {
            minutesInput.value = config.totalMinutes;
            toggleDigitalTimer.checked = config.showDigitalTimer;
            settingsModal.classList.remove('hidden');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        saveSettingsBtn.addEventListener('click', () => {
            const mins = parseInt(minutesInput.value, 10);
            if (!isNaN(mins) && mins > 0) {
                config.totalMinutes = mins;
                state.totalSeconds = mins * 60;
            }
            resetTimer();
            config.showDigitalTimer = toggleDigitalTimer.checked;
            settingsModal.classList.add('hidden');
            updateUI();
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mins = e.target.getAttribute('data-mins');
                minutesInput.value = mins;
            });
        });

        testSoundBtn.addEventListener('click', () => {
            playBeepBeepBeep();
        });

        requestGyroBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            gyroPermissionBlock.classList.add('hidden');
                        }
                    })
                    .catch(console.error);
            }
        });

        // Application Start
        window.onload = function() {
            resizeCanvas();
            initGyroscope();
            state.lastFrameTime = performance.now();
            requestAnimationFrame(updateSimulation);
            updateUI();
        };
    </script>
</body>
</html>
