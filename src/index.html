<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link id="favicon" rel="icon" href="./images/icon.png" sizes="any" type="image/png">
    <title>Песочные Часы</title>

</head>
<body>

    <!-- Main Hourglass Canvas View -->
    <main class="canvas-container">
        <div class="ambient-glow"></div>
        <canvas id="hourglass-canvas"></canvas>
    </main>

    <!-- Side Control Panel / Top Bar on Mobile -->
    <aside class="side-panel">
        <div class="top-actions">
            <!-- Digital Clock Display -->
            <div class="timer-section" id="timer-section">
                <div id="digital-timer" class="digital-clock">01:00</div>
            </div>

            <div class="action-buttons">
                <button id="settings-btn" class="icon-btn" title="Настройки" aria-label="Настройки">
                    <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Settings Modal Dialog -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button id="close-settings-btn" class="close-btn" aria-label="Закрыть">
                    <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label for="minutes-input" class="form-label">Длительность (минуты):</label>
                    <input type="number" id="minutes-input" min="1" max="180" step="1" value="1" class="text-input">
                </div>

                <div class="form-group">
                    <label class="form-label-sub">Быстрый выбор:</label>
                    <div class="preset-grid">
                        <button class="preset-btn" data-mins="1">1 мин</button>
                        <button class="preset-btn" data-mins="3">3 мин</button>
                        <button class="preset-btn" data-mins="5">5 мин</button>
                        <button class="preset-btn" data-mins="10">10 мин</button>
                    </div>
                </div>

                <div class="setting-row">
                    <span>Показывать таймер</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-digital-timer" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <div class="setting-row">
                    <span>Звуковой сигнал</span>
                    <button id="test-sound-btn" class="secondary-btn-sm">Проверить "Бип-бип"</button>
                </div>

                <div id="gyro-permission-block" class="setting-block">
                    <button id="request-gyro-btn" class="gyro-btn">
                        <svg class="icon-sm text-emerald" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18v-6m0 0V6m0 6h6m-6 0H6"/>
                        </svg>
                        <span>Разрешить гироскоп</span>
                    </button>
                </div>
            </div>

            <div class="modal-footer">
                <button id="save-settings-btn" class="save-btn">Сохранить и Применить</button>
            </div>
        </div>
    </div>


</body>
</html>
